apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keda-demo
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/EmilRim/keda-event-driven-autoscaling.git
    targetRevision: main
    path: kubernetes

  destination:
    server: https://kubernetes.default.svc
    namespace: keda-demo

  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
