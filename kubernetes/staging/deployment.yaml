
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keda-demo-staging
  namespace: keda-demo
spec:
  selector:
    matchLabels:
      app: keda-demo-staging
  template:
    metadata:
      labels:
        app: keda-demo-staging
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: keda-demo-staging
          image: emkatyte/keda-demo:v1
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 128Mi
