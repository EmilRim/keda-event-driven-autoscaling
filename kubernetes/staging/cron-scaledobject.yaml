
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: keda-demo-staging-scaler
  namespace: keda-demo
spec:
  scaleTargetRef:
    name: keda-demo-staging

  pollingInterval: 30
  cooldownPeriod: 60

  minReplicaCount: 0
  maxReplicaCount: 2

  triggers:
    - type: cron
      metadata:
        timezone: Europe/Brussels
        start: "0 8 * * 1-5"
        end: "0 18 * * 1-5"
        desiredReplicas: "2"
