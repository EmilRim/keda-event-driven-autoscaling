
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: keda-demo-scaler
  namespace: keda-demo
spec:
  scaleTargetRef:
    name: keda-demo

  pollingInterval: 15
  cooldownPeriod: 60

  minReplicaCount: 1
  maxReplicaCount: 4

  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 120
          policies:
            - type: Pods
              value: 1
              periodSeconds: 60
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - type: Pods
              value: 2
              periodSeconds: 60

  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-server.monitoring.svc.cluster.local:80
        metricName: app_requests_per_second
        query: sum(rate(app_requests_total[1m]))
        threshold: "5"
        activationThreshold: "0"
